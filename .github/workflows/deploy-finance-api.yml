name: Deploy Finance API (Cloud Run)

# Kept separate from deploy-cloud-run.yml (africastn-api) so the Finance module
# can be lifted out without untangling a shared deployment.
#
# One-time setup required before this can succeed:
#   1. Create the API key secret:
#        gcloud secrets create finance-api-key --replication-policy=automatic
#        printf '%s' "$(openssl rand -hex 32)" | \
#          gcloud secrets versions add finance-api-key --data-file=-
#      Use printf, not echo. A trailing newline in the payload has broken the
#      X-API-Key comparison on the sibling service before.
#   2. Grant the deploy service account access to finance-api-key and
#      db-password, and roles/cloudsql.client on africastn-db.
#   3. Set FINANCE_API_URL and FINANCE_API_KEY on the astn-os service so the
#      portal can reach this one.

on:
  push:
    branches: [main]
    paths:
      - "finance-api/**"
      - ".github/workflows/deploy-finance-api.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: stza-finance-api
          region: europe-west1
          source: ./finance-api
          # See deploy-frontend.yml for why this is overwrite and not merge.
          env_vars_update_strategy: overwrite
          env_vars: |
            DB_NAME=africastn_os
            DB_USER=africastn_app
            SECRET_PROJECT=africanstn-research
            INSTANCE_CONNECTION_NAME=africanstn-research:europe-west1:africastn-db
          secrets: |
            DB_PASSWORD=db-password:latest
            FINANCE_API_KEY=finance-api-key:latest
          # Ingress is "all", mirroring africastn-api. astn-os calls this
          # service over the public internet, so internal-and-cloud-load-
          # balancing would block it. The X-API-Key check is what protects the
          # service, and only the Next.js server holds the key.
          flags: >-
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --timeout=60
            --ingress=all
            --allow-unauthenticated
            --add-cloudsql-instances=africanstn-research:europe-west1:africastn-db
