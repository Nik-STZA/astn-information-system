name: Deploy Frontend (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "tailwind.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: astn-os
          region: europe-west1
          source: ./
          # env_vars_update_strategy: overwrite makes this block the complete
          # and only source of environment variables. The action defaults to
          # merge, which leaves anything previously set on the service in place
          # even after it is deleted here. Deleting a variable from this file
          # must actually remove it from the service.
          #
          # Anything set by hand with gcloud run services update is therefore
          # lost on the next deploy. Add new values here, not on the service.
          #
          # Do not put comments inside the env_vars block: the action does not
          # strip them and turns each one into an environment variable.
          #
          # FEATURES is space separated because the action treats a comma inside
          # a value as a delimiter between variables, which once reduced it to
          # FEATURES=registry and hid three live modules in production.
          env_vars_update_strategy: overwrite
          env_vars: |
            AUTH_MODE=iap
            CLOUD_RUN_API_URL=https://africastn-api-782190795609.europe-west1.run.app
            FINANCE_API_URL=https://stza-finance-api-782190795609.europe-west1.run.app
            XERO_REDIRECT_URI=https://os.stza.io/api/finance/xero/callback
            FEATURES=registry compliance publishing finance
          secrets: |
            CLOUD_RUN_API_KEY=api-key:latest
            FINANCE_API_KEY=finance-api-key:latest
          flags: >-
            --memory=1Gi
            --cpu=1
            --min-instances=0
            --max-instances=3
            --timeout=60
            --allow-unauthenticated
            --ingress=internal-and-cloud-load-balancing
