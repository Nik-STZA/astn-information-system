name: Nightly Supabase delta sync

# Stopgap until the research agent writes to Cloud SQL directly: copies any
# new/changed rows from Supabase into Cloud SQL nightly so the OS (which now
# reads exclusively from Cloud SQL) stays current with the news pipeline.
# Remove this workflow once africanstn-research-agent is repointed.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Start Cloud SQL Auth Proxy
        run: |
          curl -sLo cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.2/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy africanstn-research:europe-west1:africastn-db --port 15432 &
          sleep 5

      - name: Fetch secrets
        run: |
          gcloud secrets versions access latest --secret=supabase-db-password > /tmp/supa_pwd.txt
          echo "PGPWD=$(gcloud secrets versions access latest --secret=db-password)" >> "$GITHUB_ENV"

      - name: Install pg
        run: npm install pg --no-save

      - name: Run delta sync
        env:
          SUPA_PWD_FILE: /tmp/supa_pwd.txt
          CSQL_USER: africastn_app
        run: |
          node scripts/migrate-supabase.js
          node scripts/freshness-sync.js

      - name: Cleanup
        if: always()
        run: rm -f /tmp/supa_pwd.txt
