name: Deploy Cloud Run API

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - 'server-*-routes.js'
      - '.github/workflows/deploy-cloud-run.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy route files into deploy/
        run: cp server-*-routes.js deploy/

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: africastn-api
          region: europe-west1
          source: deploy/
          env_vars: |
            DB_USER=africastn_app
            DB_NAME=africastn_os
            INSTANCE_CONNECTION_NAME=africanstn-research:europe-west1:africastn-db
          secrets: |
            DB_PASSWORD=db-password:latest
            API_KEY=api-key:latest
          flags: >-
            --add-cloudsql-instances=africanstn-research:europe-west1:africastn-db
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --timeout=300
